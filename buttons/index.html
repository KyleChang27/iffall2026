<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons — Kyle Chang</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Button Styling — Kyle Chang</h1>
    <div class="buttons">
      <div class="button_container">
        <a id="btn_nike" href="https://www.nike.com/" target="_blank" rel="noopener noreferrer">NIKE <span aria-hidden="true">↗</span></a>
      </div>
      <div class="button_container">
        <a id="btn_lyft" href="https://www.lyft.com/" target="_blank" rel="noopener noreferrer">lyft</a>
      </div>
      <div class="button_container">
        <a id="btn_npr" href="https://www.npr.org/" target="_blank" rel="noopener noreferrer" aria-label="NPR"><span class="n">n</span><span class="p">p</span><span class="r">r</span></a>
      </div>
      <div class="button_container">
        <a id="btn_newyorker" href="https://www.newyorker.com/" target="_blank" rel="noopener noreferrer">The<br><span>New Yorker</span></a>
      </div>
      <div class="button_container">
        <a id="btn_oldnavy" href="https://www.oldnavy.com/" target="_blank" rel="noopener noreferrer">OLD NAVY</a>
      </div>
    </div>
  </main>
</body>
</html>
